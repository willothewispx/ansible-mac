version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  bootstrap:
    desc: Run the full bootstrap (or STEPS="brewfile mas")
    cmds:
      - ./bootstrap.sh {{.STEPS}}

  bootstrap:homebrew:
    desc: Install Homebrew
    cmds:
      - ./bootstrap.sh homebrew

  bootstrap:brewfile:
    desc: Install everything in the Brewfile
    cmds:
      - ./bootstrap.sh brewfile

  bootstrap:mas:
    desc: Install/remove Mac App Store apps
    cmds:
      - ./bootstrap.sh mas

  bootstrap:git:
    desc: Set the global git identity
    cmds:
      - ./bootstrap.sh git

  bootstrap:macos:
    desc: Apply macOS defaults and the key remap LaunchAgent
    cmds:
      - ./bootstrap.sh macos

  bootstrap:dotfiles:
    desc: Clone dotfiles and stow them
    cmds:
      - ./bootstrap.sh dotfiles

  bootstrap:hooks:
    desc: Enable the secret-scan pre-commit hook for this repo
    cmds:
      - ./bootstrap.sh hooks
